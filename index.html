<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NanoDreamer Grid</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="grid" class="grid"></div>
  <button id="settings-toggle" class="settings-toggle" aria-label="Toggle settings">⚙</button>
  <div id="settings" class="settings hidden">
    <h2>Settings</h2>
    <label>
      Model
      <select id="model-select">
        <option value="landscapes">Landscapes</option>
        <option value="liminal">Liminal Interiors</option>
      </select>
    </label>
    <label>
      Images
      <select id="count-select">
        <option value="1">1</option>
        <option value="9" selected>9</option>
      </select>
    </label>
    <label>
      Interval (seconds)
      <input type="range" id="interval-slider" min="1" max="30" value="5">
      <span id="interval-value">5s</span>
    </label>
    <label>
      Truncation (quality / diversity)
      <input type="range" id="trunc-slider" min="0.3" max="1.0" step="0.05" value="0.7">
      <span id="trunc-value">0.70</span>
    </label>
    <label>
      <input type="checkbox" id="auto-generate" checked> Auto-generate
    </label>
    <button id="generate-now">Generate now</button>
    <p id="status">Loading...</p>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
